info:
  name: logout-all
  type: http
  seq: 3

http:
  method: POST
  url: "{{server}}/auth/logout-all"
  headers:
    - name: Authorization
      value: Bearer  {{accessToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("logout from all sessions", function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.have.property('success');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
