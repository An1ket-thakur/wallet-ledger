info:
  name: refresh
  type: http
  seq: 5

http:
  method: POST
  url: "{{server}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken":"{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("accessToken", res.body.accessToken);
          bru.setVar("refreshToken", res.body.refreshToken);
        }
    - type: tests
      code: |-
        test("refreshes session using refresh token", function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.have.property('accessToken');
          expect(res.body).to.have.property('refreshToken');
          expect(res.body).to.have.property('expiresIn');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
