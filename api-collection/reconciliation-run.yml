info:
  name: reconciliation-run
  type: http
  seq: 3

http:
  method: POST
  url: "{{server}}/reconciliation/run"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("reconciliation manual run by admin", function() {
           expect(res.status).to.equal(201);
           expect(res.body).to.have.property('id');
           expect(res.body).to.have.property('status');
           expect(res.body).to.have.property('totalDebits');
           expect(res.body).to.have.property('totalCredits');
           expect(res.body).to.have.property('unbalancedTransactionCount');
           expect(res.body).to.have.property('details');
           expect(res.body).to.have.property('triggeredBy');
           expect(res.body).to.have.property('durationMs');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
