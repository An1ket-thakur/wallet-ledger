info:
  name: get-userwallet
  type: http
  seq: 10

http:
  method: GET
  url: "{{server}}/support/users/:id/wallets"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: id
      value: c62431d4-c27b-40b7-ba9a-1283634c03e7
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("gives all wallets of a user", function() {
           expect(res.status).to.equal(200);
           expect(res.body).to.be.an('array');
           expect(res.body[0]).to.have.property('id');
           expect(res.body[0]).to.have.property('currency');
           expect(res.body[0]).to.have.property('status');
           expect(res.body[0]).to.have.property('balance');
           expect(res.body[0]).to.have.property('createdAt');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
