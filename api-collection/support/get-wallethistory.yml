info:
  name: get-wallethistory
  type: http
  seq: 4

http:
  method: GET
  url: "{{server}}/support/wallets/:id/history"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: id
      value: 0bfb8242-a213-4fba-9f89-010a330863e1
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("get one wallet history", function() {
           expect(res.status).to.equal(200);
           expect(res.body.entries).to.be.an('array');
           expect(res.body).to.have.property('walletId');
           expect(res.body).to.have.property('currency');
           expect(res.body).to.have.property('balance');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
