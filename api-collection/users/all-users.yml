info:
  name: all-users
  type: http
  seq: 2

http:
  method: GET
  url: "{{server}}/users"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("gives all users in array", function() {
           expect(res.status).to.equal(200);
           expect(res.body).to.be.an('array');
           expect(res.body[0]).to.have.property('id');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
