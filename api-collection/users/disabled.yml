info:
  name: disabled
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{server}}/users/:id/disabled"
  headers:
    - name: Authorization
      value: Bearer  {{accessToken}}
  params:
    - name: id
      value: ed71edec-1051-4303-a7cd-027b8d06c275
      type: path
  body:
    type: json
    data: |-
      {
        "disabled": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("user disabled by admin", function() {
         expect(res.status).to.equal(200);
         expect(res.body).to.have.property('id');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
