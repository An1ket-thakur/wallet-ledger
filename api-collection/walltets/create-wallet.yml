info:
  name: create-wallet
  type: http
  seq: 4

http:
  method: POST
  url: "{{server}}/wallets"
  headers:
    - name: Authorization
      value: Bearer  {{accessToken}}
    - name: idempotency-key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "currency":"INR",
        "label":"Test_2_INR"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("creates a wallet", function() {
           expect(res.status).to.equal(201);
           expect(res.body).to.have.property('id');
           expect(res.body).to.have.property('currency');
           expect(res.body).to.have.property('status');
           expect(res.body).to.have.property('createdAt');
           expect(res.body).to.have.property('label');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
