info:
  name: webhook-provider
  type: http
  seq: 2

http:
  method: POST
  url: "{{server}}/webhooks/payment-provider"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const CryptoJS = require('crypto-js');

        const SECRET = bru.getEnvVar('PAYMENT_WEBHOOK_SECRET');

        const timestamp = Math.floor(Date.now() / 1000).toString();

        const payload = {
          eventId: CryptoJS.lib.WordArray.random(16).toString(),
          type: 'payment.succeeded',
          walletId: '0bfb8242-a213-4fba-9f89-010a330863e1',
          amount: 5000,
          currency: 'INR',
        };

        const rawBody = JSON.stringify(payload);

        const signedPayload = `${timestamp}.${rawBody}`;

        const signature = CryptoJS.HmacSHA256(
          signedPayload,
          SECRET
        ).toString(CryptoJS.enc.Hex);

        req.setHeader('x-webhook-signature', signature);
        req.setHeader('x-webhook-timestamp', timestamp);
        req.setBody(rawBody);
    - type: tests
      code: |-
        test("mock webhook provider api", function() {
           expect(res.status).to.equal(201);
           expect(res.body).to.have.property('status');
           expect(res.body).to.have.property('transactionId');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
